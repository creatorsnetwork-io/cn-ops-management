<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Ops Portal, v7</title>
<style>
:root{
  --bg:#F6F7F9;--panel:#fff;--ink:#0F1419;--muted:#5B6572;--faint:#8A93A0;
  --line:#E5E8EC;--line2:#EFF1F4;--head:#FAFBFC;
  --blue:#0B4EA2;--teal:#10A6B8;--bluesoft:#EAF1FA;--tealsoft:#E4F5F7;
  --ok:#0F7A55;--okbg:#E9F5EF;--warn:#9C6A18;--warnbg:#FBF3E3;--bad:#B23A2F;--badbg:#FBEDEB;
  --r:10px;--rs:8px;--rx:6px;--sh:0 1px 2px rgba(15,20,25,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
.lbl{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700}
.proto{background:var(--ink);color:#D8DEE6;font-size:11.5px;padding:7px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.proto strong{color:#fff}

.shell{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 30px)}
@media(max-width:960px){.shell{grid-template-columns:1fr}.side{display:none}}
.side{background:#fff;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px}
.brand{padding:10px 8px 8px}
.cnlogo{height:46px;width:auto;display:block}
.navwrap{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}
.grp{display:flex;flex-direction:column;gap:1px}
.grp .lbl{padding:0 8px;margin-bottom:4px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 9px;border-radius:var(--rs);font-size:13.5px;width:100%;color:#2A3441}
.nav:hover{background:#F1F4F8}
.nav.on{background:var(--blue);color:#fff;font-weight:600}
.nav .pill{font-size:10px;padding:1px 6px;border-radius:20px;background:#EDF0F4;color:var(--muted);font-weight:700}
.nav.on .pill{background:rgba(255,255,255,.22);color:#fff}
.nav .pill.hot{background:var(--badbg);color:var(--bad)}
.sysbar{border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;display:flex;gap:9px;align-items:flex-start;background:var(--head)}
.sysbar i{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-top:5px;flex:0 0 7px}
.sysbar b{display:block;font-size:12px}.sysbar span{font-size:11px;color:var(--faint)}

.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 22px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.crumb{font-size:12.5px;color:var(--faint)}
.crumb b{color:var(--ink);font-weight:600}
.crumb button{color:var(--blue)}
.crumb button:hover{text-decoration:underline}
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--rs);padding:6px 11px;color:var(--faint);font-size:12.5px;background:var(--head);min-width:210px}
.searchbtn kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#fff}
.whobox{display:flex;align-items:center;gap:9px}
.whobox select{padding:6px 9px;border:1px solid var(--line);border-radius:var(--rs);background:#fff;font-size:12.5px}
.av{width:29px;height:29px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

.main{padding:22px 22px 70px;max-width:1280px}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);font-weight:700}
.eyebrow.n{color:var(--faint)}
h1{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:7px}
.lede{font-size:13.5px;color:var(--muted);margin-top:5px;max-width:730px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--rs);padding:6px 12px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;box-shadow:var(--sh)}
.btn:hover{background:var(--head)}
.btn.dark{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.ai{background:var(--tealsoft);color:#0A7C8A;border-color:#BFE6EB;font-weight:600}
.btn.hand{background:var(--bluesoft);color:var(--blue);border-color:#CBDDF2;font-weight:600}
.btn.good{background:var(--okbg);color:var(--ok);border-color:#C9E5D8;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.off{color:var(--faint);background:#F2F4F7;cursor:not-allowed;box-shadow:none}
.btn.req{color:var(--warn);border-color:#EADFC4;background:var(--warnbg)}
.btn.icon{padding:5px 8px}
.rowb{display:flex;gap:7px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;position:relative;box-shadow:var(--sh)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.05}
.kpi .v.sm{font-size:17px;padding-top:5px;line-height:1.25}
.kpi .n{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi .n.good{color:var(--ok)}.kpi .n.bad{color:var(--bad)}
.kpi .d{position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%}
.d.r{background:var(--bad)}.d.a{background:var(--warn)}.d.g{background:var(--ok)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.panel>header{padding:12px 15px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h2{font-size:14px;font-weight:600}
.panel>header .sub2{font-size:12px;color:var(--faint);margin-top:2px}
.panel>header .hint{font-size:11.5px;color:var(--faint)}
.pad{padding:15px}
.badge{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;border:1px solid var(--line);border-radius:var(--rx);padding:3px 8px;color:var(--muted)}
.badge.ai{border-color:#BFE6EB;background:var(--tealsoft);color:#0A7C8A}
.badge.ok{border-color:#C9E5D8;background:var(--okbg);color:var(--ok)}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}
th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700;background:var(--head)}
tr:last-child td{border-bottom:none}
td.b{font-weight:600}td.dim{color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td{background:#FDF6F5}tr.soft td{background:#FCF8EF}
tr.click:hover td{background:#F5F8FC;cursor:pointer}

.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}
.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--bluesoft);color:var(--blue)}
.mute{background:#F0F2F5;color:var(--muted)}.tl{background:var(--tealsoft);color:#0A7C8A}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid2.even{grid-template-columns:1fr 1fr}
.grid2.single{grid-template-columns:1fr}
@media(max-width:960px){.grid2,.grid2.even{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:820px){.cards{grid-template-columns:1fr}}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
@media(max-width:1020px){.cards3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.cards3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh)}
.card .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-size:16.5px;font-weight:700;letter-spacing:-.015em;margin-top:11px}
.card .cs{font-size:12.5px;color:var(--muted);margin-top:2px}
.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line2)}
.metagrid .v{font-size:12.5px;font-weight:600;margin-top:2px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line2)}
.chipsline{display:flex;gap:5px}
.tchip{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bluesoft);color:var(--blue)}
.cmark{border-radius:9px;background:linear-gradient(135deg,#25313F,#4A5A6B);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.star{font-size:15px;line-height:1;color:var(--faint)}
.star.on{color:#D9A21B}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--muted);box-shadow:var(--sh)}
.fchip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.vtoggle{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:#fff}
.vtoggle button{padding:5px 11px;font-size:12.5px;color:var(--muted)}
.vtoggle button.on{background:var(--ink);color:#fff}
.tabsrow{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tb{padding:8px 13px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tb.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--sh)}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}}
.stats>div{padding:13px 15px;border-right:1px solid var(--line2)}
.stats>div:last-child{border-right:none}
.stats .v{font-size:15px;font-weight:700;margin-top:5px}
.stats .s{font-size:11.5px;color:var(--muted);margin-top:3px}

.stepper{display:flex;align-items:flex-start;padding:18px 15px 4px;overflow-x:auto}
.st{display:flex;flex-direction:column;align-items:center;min-width:84px;position:relative;flex:1}
.st .cir{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;z-index:1}
.st.done .cir{background:var(--blue);border-color:var(--blue);color:#fff}
.st.now .cir{border-color:var(--teal);color:var(--teal);border-width:2px}
.st .lb{font-size:11.5px;margin-top:7px;color:var(--muted);text-align:center;white-space:nowrap}
.st.now .lb{color:var(--teal);font-weight:700}.st.done .lb{color:var(--ink)}
.st .bar{position:absolute;top:12px;left:50%;right:-50%;height:1.5px;background:var(--line)}
.st.done .bar{background:var(--blue)}.st:last-child .bar{display:none}

.cyc{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.step{font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.step.done{background:var(--okbg);border-color:#C9E5D8;color:var(--ok)}
.step.now{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.step.stuck{background:var(--badbg);border-color:#F0D6D2;color:var(--bad);font-weight:600}
.step.wait{background:var(--warnbg);border-color:#EADFC4;color:var(--warn)}
.arw{color:var(--faint);font-size:10px}

.bar2{height:5px;border-radius:4px;background:#EBEEF2;overflow:hidden;min-width:70px}
.bar2 i{display:block;height:100%;background:var(--blue)}
.bar2 i.a{background:var(--warn)}.bar2 i.r{background:var(--bad)}
.dl{display:flex;align-items:center;gap:13px;padding:11px 15px;border-bottom:1px solid var(--line2)}
.dl:last-child{border-bottom:none}
.dl .nm{flex:0 0 180px}.dl .nm b{display:block;font-size:13.5px;font-weight:600}.dl .nm span{font-size:11px;color:var(--faint)}
.dl .pr{flex:1}.dl .pr .sub{font-size:11px;color:var(--faint);margin-top:4px}
.dl .rt{flex:0 0 112px;text-align:right}.dl .rt b{display:block;font-size:13.5px;font-weight:700}.dl .rt span{font-size:11px;color:var(--faint)}

.srcs{display:flex;flex-direction:column;gap:11px}
.src{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;display:flex;gap:11px;align-items:center;box-shadow:var(--sh)}
.src .ic{width:33px;height:33px;border-radius:8px;background:var(--bluesoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 33px}
.src .tx{flex:1;min-width:0}.src .v{font-size:13px;font-weight:600;margin-top:2px}.src .s{font-size:11.5px;color:var(--faint)}

.wi{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.wi:last-child{border-bottom:none}
.wi .ty{width:40px;height:25px;border-radius:6px;background:var(--bluesoft);color:var(--blue);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.wi .tx{flex:1;min-width:200px}.wi .tx b{display:block;font-size:13.5px;font-weight:600}.wi .tx span{font-size:11.5px;color:var(--muted)}
.wi .mt{flex:0 0 92px}.wi .mt .v{font-size:12.5px;font-weight:600;margin-top:2px}
.wi .ac{display:flex;gap:6px;flex-wrap:wrap}
.ref{background:var(--head);border:1px solid var(--line2);border-radius:var(--rs);padding:10px 12px;margin-top:9px}
.ref .rl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:5px}
.ref .rc{font-size:12.5px;line-height:1.55;white-space:pre-wrap}
.ref .rm{font-size:11.5px;color:var(--faint);margin-top:6px}

.fb{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh)}
.fb .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.fb h3{font-size:15px;font-weight:700;margin:9px 0 8px}
.fb .q{background:var(--head);border-left:2px solid var(--teal);padding:10px 13px;font-size:13px;border-radius:0 var(--rx) var(--rx) 0}
.fb .meta{font-size:11.5px;color:var(--faint);margin-top:9px}
.fb .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line2)}

.note{font-size:12px;color:var(--faint);max-width:900px}
.callout{border-left:2px solid var(--teal);background:var(--tealsoft);padding:11px 14px;border-radius:0 var(--rx) var(--rx) 0;font-size:12.5px;color:#0A6B77;margin-bottom:14px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.callout b{color:#08565F}
.guard{border-left:2px solid var(--ok);background:var(--okbg);padding:11px 14px;border-radius:0 var(--rx) var(--rx) 0;font-size:12.5px;color:#0C6144;margin-bottom:14px}
.alertbar{border-left:2px solid var(--bad);background:var(--badbg);padding:11px 14px;border-radius:0 var(--rx) var(--rx) 0;font-size:12.5px;color:#8E2E25;margin-bottom:14px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.trust{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 15px;border-bottom:1px solid var(--line2);background:var(--head);font-size:12px;color:var(--muted)}
.trust b{color:var(--ink)}.trust .sp{margin-left:auto}

.chk{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line2);align-items:flex-start}
.chk:last-child{border-bottom:none}
.chk .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 19px;margin-top:1px;color:#fff}
.chk.done .box{background:var(--ok);border-color:var(--ok)}
.chk.now .box{border-color:var(--teal);border-width:2px}
.chk .tx{flex:1}.chk .tx b{display:block;font-size:13.5px;font-weight:600}.chk .tx span{font-size:12px;color:var(--muted)}
.chk.done .tx b{color:var(--muted)}

.tline{display:flex;flex-direction:column}
.ev{display:flex;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line2)}
.ev:last-child{border-bottom:none}
.ev .tm{flex:0 0 112px;font-size:11.5px;color:var(--faint)}
.ev .dt{flex:0 0 8px;position:relative}
.ev .dt i{position:absolute;top:5px;left:0;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.ev.cl .dt i{background:var(--teal)}.ev.sys .dt i{background:var(--faint)}
.ev .cn{flex:1}.ev .cn b{display:block;font-size:13px;font-weight:600}.ev .cn span{font-size:12px;color:var(--muted)}

.bfield{padding:12px 15px;border-bottom:1px solid var(--line2)}
.bfield:last-child{border-bottom:none}
.bfield .v{font-size:13px;margin-top:5px}
.pillset{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pl{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;background:var(--head)}
.pl.no{background:var(--badbg);border-color:#F0D6D2;color:var(--bad)}
.pl.yes{background:var(--okbg);border-color:#C9E5D8;color:var(--ok)}

.jobs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
@media(max-width:1000px){.jobs{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.jobs{grid-template-columns:1fr}}
.job{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.job .jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job .dotg{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.job .dotg.s{background:var(--warn)}
.job h4{font-size:13.5px;font-weight:600;margin-top:11px}
.job .jd{font-size:11.5px;color:var(--faint)}
.job .jr{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line2)}
.job .jr:first-of-type{margin-top:10px;border-top:1px solid var(--line2)}
.job .jr span:first-child{color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.job .jr span:last-child{font-weight:600}
.job button{width:100%;margin-top:11px;border:1px solid var(--line);border-radius:var(--rs);padding:7px;font-size:12.5px;text-align:center}

.scrim{position:fixed;inset:0;background:rgba(15,20,25,.5);display:none;align-items:flex-start;justify-content:center;padding:54px 18px;z-index:60;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:820px;overflow:hidden}
.modal>header{padding:19px 21px 15px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:14px}
.modal .mh .e{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
.modal .mh h3{font-size:20px;font-weight:700;margin-top:5px;letter-spacing:-.02em}
.modal .mh p{font-size:12.5px;color:var(--muted);margin-top:5px}
.x{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 29px;background:#fff}
.mbody{padding:18px 21px;display:grid;grid-template-columns:148px 1fr;gap:18px}
.mbody.single{grid-template-columns:1fr}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{padding:8px 11px;border-radius:var(--rs);font-size:13px;color:var(--muted)}
.tab.on{background:var(--tealsoft);color:#0A7C8A;font-weight:600}
.fl{font-size:12px;font-weight:600;margin-bottom:5px}
textarea,input[type=text],select.f{width:100%;border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;font:inherit;font-size:13px;background:#fff;resize:vertical}
textarea{min-height:70px}
.dz{border:1px dashed var(--line);border-radius:var(--r);padding:30px 18px;text-align:center;background:var(--head)}
.gen{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;background:var(--head);margin-top:13px}
.out{border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-top:13px;background:var(--head);font-size:13px;white-space:pre-wrap}
.mfoot{padding:14px 21px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.two-in{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.gal .im{aspect-ratio:1;border:1px solid var(--line);border-radius:var(--rs);background:linear-gradient(135deg,#E7EDF4,#CFDCE6 60%,#B9CCD9);display:flex;align-items:flex-end;padding:8px}
.gal .im.sel{outline:2px solid var(--teal);outline-offset:2px}
.gal .im span{font-size:10px;background:rgba(255,255,255,.9);border-radius:4px;padding:2px 6px;color:var(--muted)}

.sov{position:fixed;inset:0;background:rgba(15,20,25,.45);display:none;justify-content:center;padding:84px 18px;z-index:70}
.sov.on{display:flex}
.sbox{background:#fff;border-radius:14px;width:100%;max-width:620px;overflow:hidden;height:fit-content}
.sbox input{width:100%;border:none;border-bottom:1px solid var(--line2);padding:16px 18px;font:inherit;font-size:15px;outline:none}
.sres{max-height:400px;overflow-y:auto}
.sr{display:flex;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line2);align-items:center}
.sr:hover{background:var(--head);cursor:pointer}
.sr .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;flex:0 0 82px}
.sr .t{flex:1;font-size:13.5px;font-weight:600}
.sr .m{font-size:12px;color:var(--muted);font-weight:400}

.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:11px 15px;border-radius:var(--r);font-size:13px;display:flex;gap:9px;align-items:center;z-index:80;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:440px}
.toast.on{opacity:1;transform:none}

.pshell{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 30px)}
@media(max-width:960px){.pshell{grid-template-columns:1fr}}
.pside{background:#fff;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px}
.plock{margin-top:auto;border:1px solid #C9E5D8;background:var(--okbg);border-radius:var(--rs);padding:10px 12px;font-size:11.5px;color:#0C6144}
.plock b{display:block;font-size:12px}
.post{display:flex;gap:15px;padding:15px 17px;border-bottom:1px solid var(--line2);align-items:center;flex-wrap:wrap}
.post:last-child{border-bottom:none}
.dbox{flex:0 0 58px;border:1px solid var(--line);border-radius:var(--rs);text-align:center;padding:8px 0;background:var(--head)}
.dbox b{display:block;font-size:19px;font-weight:700;line-height:1}
.dbox span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.post .pc{flex:1;min-width:210px}
.post .pc h4{font-size:14.5px;font-weight:600;margin:6px 0 5px}
.post .pc p{font-size:12.5px;color:var(--muted)}
.cobrand{display:flex;align-items:center;gap:11px}
.cobrand .div{width:1px;height:26px;background:var(--line)}
.chtabs{display:flex;gap:2px;border-bottom:1px solid var(--line2)}
.cht{padding:7px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.cht.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.cap{font-size:13.5px;line-height:1.62;white-space:pre-wrap}
.tags{margin-top:11px;display:flex;gap:5px;flex-wrap:wrap}
.tags span{font-size:12px;color:var(--blue);background:var(--bluesoft);border-radius:5px;padding:2px 7px}
.prev{width:100%;aspect-ratio:4/5;border:1px solid var(--line);border-radius:var(--rs);background:linear-gradient(135deg,#E7EDF4,#CFDCE6 60%,#B9CCD9);display:flex;align-items:flex-end;padding:10px}
.prev span{font-size:11px;background:rgba(255,255,255,.9);border-radius:4px;padding:2px 7px;color:var(--muted)}
.art{max-width:650px}
.art h3{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.art p{font-size:14px;line-height:1.68;margin-bottom:13px}

.phones{display:grid;grid-template-columns:repeat(3,minmax(0,300px));gap:20px}
@media(max-width:1000px){.phones{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.phones{grid-template-columns:1fr}}
.ph{border:1px solid var(--line);border-radius:26px;background:#fff;padding:12px;box-shadow:0 4px 18px rgba(15,20,25,.06)}
.ph .scr{background:var(--bg);border-radius:18px;padding:14px;min-height:420px}
.ph .pt{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:12px}
.ph h4{font-size:17px;font-weight:700;letter-spacing:-.02em}
.ph .psub{font-size:11.5px;color:var(--muted);margin:3px 0 13px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;margin-bottom:9px}
.mcard b{display:block;font-size:13px;font-weight:600}.mcard span{font-size:11.5px;color:var(--muted)}
.mbtn{width:100%;background:var(--blue);color:#fff;border-radius:var(--rs);padding:11px;font-size:13.5px;font-weight:600;text-align:center;margin-top:6px}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 11px}
.mchip{border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11.5px;background:#fff;color:var(--muted)}
.mchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mfield{background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:10px 11px;font-size:12.5px;color:var(--faint);margin-bottom:11px}
</style>
</head>

 posts:[
  {id:'p1',d:'17',m:'Aug',t:'Reel',n:'Private aviation, reimagined',s:'Awaiting your review',
   ig:"Some journeys are measured in hours saved. Others in questions you never had to answer.\n\nA private aviation request rarely starts with a route. It starts with a constraint, a family, a meeting that cannot move. What follows is arrangement, not booking.",
   igh:['#EliteGlobalConcierge','#PrivateAviation','#QuietAccess','#PrivateTravel'],
   fb:"There is a version of travel most people do not talk about publicly. No queues, no compromises, no explaining yourself to a call centre.",
   fbh:['#EliteGlobalConcierge','#PrivateAviation','#LuxuryTravel'],
   li:"Before the aircraft. Before the route. Before the departure slot.\n\nWhat matters most is having someone who already understands the constraint you are working around.",
   lih:['#PrivateAviation','#LuxuryTravel','#TravelConcierge'],long:0},
  {id:'p2',d:'19',m:'Aug',t:'Carousel',n:'A table worth crossing continents for',s:'In production',
   ig:"Six restaurants our clients return for, and what it takes to hold a table on a Saturday in August.",igh:['#EliteGlobalConcierge','#QuietAccess'],
   fb:"Six restaurants our clients return for. Swipe through.",fbh:['#EliteGlobalConcierge'],
   li:"Access is rarely about money. It is about being known.",lih:['#LuxuryTravel','#Hospitality'],long:0},
  {id:'p3',d:'21',m:'Aug',t:'Reel',n:'The quiet side of Mykonos',s:'Changes received',
   ig:"The island most people photograph, and the one we actually book.",igh:['#EliteGlobalConcierge','#Mykonos'],
   fb:"The island most people photograph, and the one we actually book.",fbh:['#EliteGlobalConcierge'],
   li:"Two versions of the same island, and why we only recommend one of them.",lih:['#LuxuryTravel','#Greece'],long:0},
  {id:'p4',d:'24',m:'Aug',t:'LinkedIn article',n:'Why we do not publish prices',s:'Awaiting your review',
   ig:"",igh:[],fb:"",fbh:[],
   li:"There is a question we are asked before almost any other, usually within the first two minutes of a first conversation. What does this cost.\n\nIt is a fair question and we understand why it is asked first. Most of travel has trained people to expect a number, then to work backwards from it. A package, a tier, a room category, a per-person rate. The number arrives before the understanding does.\n\nWe do not publish prices, and the reason is not mystique. It is that the number is the last honest thing we can tell you, not the first. Two clients can ask for the same week in the same city and want almost nothing in common. One is travelling with three generations and needs the days to hold together without anybody feeling managed. The other is flying in for thirty hours around a board meeting and needs the city to disappear when it should.\n\nThere is a second reason, less comfortable to say out loud. A published price sets the ceiling of what a client will ask for. People edit their own requests downward to fit a number they have already seen, and the edits are almost always the things that would have mattered most.\n\nSo we begin the other way around. A conversation, a set of constraints, sometimes a fairly direct question about what has gone wrong on previous trips. Then a proposal that carries a number attached to a specific set of arrangements, which either reads as obviously worth it or does not.",
   lih:['#EliteGlobalConcierge','#LuxuryTravel','#PrivateTravel'],long:1}]

/* ===== SEARCH ===== */
function searchOpen(){document.getElementById('sov').classList.add('on');var i=document.getElementById('sq');i.value='';searchRun('');i.focus()}
function searchClose(){document.getElementById('sov').classList.remove('on')}
function searchRun(q){
 q=(q||'').toLowerCase();var out=[];
 D.clients.forEach(function(c){if(!q||c.n.toLowerCase().indexOf(q)>-1)out.push(['Client',c.n,c.t,'client:'+c.id])});
 D.projects.forEach(function(p){if(!q||p.n.toLowerCase().indexOf(q)>-1||cName(p.c).toLowerCase().indexOf(q)>-1)
  out.push([p.arch?'Archived':'Project',p.n,cName(p.c)+' · '+D.typeLabel[p.ty],'project:'+p.id])});
 if(q){
  D.work.forEach(function(w){if(w.t.toLowerCase().indexOf(q)>-1)out.push(['Work item',w.t,cShort(P(w.p).c)+' · '+WS[w.ws]+' · '+pname(w.own),'project:'+w.p])});
  Object.keys(D.cal).forEach(function(k){D.cal[k].rows.forEach(function(r){
   if(r.o.toLowerCase().indexOf(q)>-1)out.push(['Calendar row',r.o,cName(k)+' · '+r.d,'calendar'])})});
  D.qc.forEach(function(x){if((x.cap||'').toLowerCase().indexOf(q)>-1||x.t.toLowerCase().indexOf(q)>-1)
   out.push(['Caption, QC',x.t,(x.cap||'').slice(0,70)+'...','qc'])});
  D.fb.forEach(function(f){if(f.txt.toLowerCase().indexOf(q)>-1||f.item.toLowerCase().indexOf(q)>-1)
   out.push(['Feedback',f.item,f.txt.slice(0,70)+'...','feedback'])});
  D.req.forEach(function(r){if(r.w.toLowerCase().indexOf(q)>-1)out.push(['Request',r.w,cShort(r.c)+' · '+r.ty,'request:'+r.id])});
  D.pipe.forEach(function(x){if(x.n.toLowerCase().indexOf(q)>-1)out.push(['Prospect',x.n,x.m+' · '+x.s,'prospect:'+x.id])});
 }
 document.getElementById('sres').innerHTML=out.slice(0,14).map(function(r){
  return '<div class="sr" data-go="'+r[3]+'" data-searchclose="1"><div class="k">'+r[0]+'</div><div class="t">'+r[1]+'<div class="m">'+r[2]+'</div></div></div>'}).join('')
  ||'<div class="sr"><div class="m" style="padding:4px 0">Nothing found</div></div>';
}

function bumpDl(w,which){
 var p=P(w.p);if(!p||!w.dl)return;
 (p.dl||[]).forEach(function(d){if(d.n===w.dl){if(which==='s')d.s++;else d.a++}});
}
function bind(){
 var sel=document.getElementById('rolesel');
 if(sel)sel.onchange=function(){
  S.role=sel.value;S.wTab='mine';S.postOpen=null;
  var allowed=[];NAV.forEach(function(g){g.items.forEach(function(n){if(n.roles.indexOf(S.role)>-1)allowed.push(n.v)})});
  var pages=['home','clients','projects','work','calendar','qc','feedback','requests','reports','links','archive','escalations','pipeline','team','jobs','settings','mobile'];
  if(pages.indexOf(S.view)>-1&&allowed.indexOf(S.view)<0)S.view=allowed[0]||'home';
  closeModal();render()};
 var sq=document.getElementById('sq');
 if(sq)sq.oninput=function(){searchRun(sq.value)};
}

 var t=e.target.closest('[data-go],[data-act],[data-filter],[data-cal],[data-tab],[data-ptab],[data-ftab],[data-qtab],[data-wtab],[data-cht],[data-fav],[data-lv],[data-favonly]');
 if(!t)return;
 var d=t.dataset;
 if(d.filter){S.filter=d.filter;render();return}
 if(d.favonly!==undefined){S.favOnly=+d.favonly;render();return}
 if(d.lv){var a=d.lv.split(':');S.listView[a[0]]=a[1];render();return}
 if(d.fav){var f=d.fav.split(':');var o=f[0]==='client'?C(f[1]):P(f[1]);o.fav=o.fav?0:1;render();toast((o.fav?'Pinned ':'Unpinned ')+(o.n)+'. Favourites sort to the top.');return}
 if(d.cal){S.calTab=d.cal;render();return}
 if(d.ftab){S.fTab=d.ftab;render();return}
 if(d.qtab){S.qTab=d.qtab;render();return}
 if(d.wtab){S.wTab=d.wtab;render();return}
 if(d.ptab){S.pTab=d.ptab;render();return}
 if(d.cht){S.chTab=d.cht;render();return}
 if(d.tab){S.mTab=d.tab;S.gen=0;drawModal();return}
 if(d.go){
  if(d.searchclose)searchClose();
  var g=d.go.split(':');
  var map={client:'client',project:'project',brain:'brain',onboard:'onboard',request:'request',prospect:'prospect'};
  if(map[g[0]])go(map[g[0]],g[1]);else go(g[0]);
  return}
 var A=d.act,id=d.id;
 if(A==='close'){closeModal();return}
 if(A==='search'){searchOpen();return}
 if(A==='noop'){toast('Not your gate. It is waiting on someone else.');return}
 if(A==='create'){openModal('create',id);return}
 if(A==='contract'){openModal('contract');return}
 if(A==='logreq'){openModal('logreq');return}
 if(A==='logfb'){openModal('logfb');return}
 if(A==='cfb'){openModal('cfb',d.msg);return}
 if(A==='sharelink'){openModal('share');return}
 if(A==='planweek'){openModal('planweek');return}
 if(A==='dispute'){openModal('dispute');return}
 if(A==='closeproj'){openModal('closeproj');return}
 if(A==='wsubmit'){openModal('submit',id);return}
 if(A==='wreassign'){openModal('reassign',id);return}
 if(A==='rtriage'){openModal('triage',id);return}
 if(A==='rconvert'){openModal('convert',id);return}
 if(A==='escconvert'){openModal('escconvert',id);return}
 if(A==='addprospect'){openModal('addprospect');return}
 if(A==='gen'){S.gen=1;drawModal();return}
 if(A==='keep'){var wk=W(id);if(wk&&wk.ws==='briefed')wk.ws='progress';closeModal();render();toast('Kept and attached. The file lives in Drive, the portal holds the link.');return}
 if(A==='extract'){S.extracted=1;drawModal();return}
 if(A==='approvebase'){closeModal();toast('Baseline v1 locked. Changes now create v2 with a reason and an author.');return}
 if(A==='push'){toast('15 cells written, 3 skipped because they already had text. Logged against your name.');return}
 if(A==='brieflink'){S.briefJob=id;S.role='freelancer';closeModal();render();toast('Opened the freelancer link. No login involved.');return}
 if(A==='openpost'){S.postOpen=id;var pp=D.posts.filter(function(x){return x.id===id})[0];S.chTab=pp&&pp.ig?'ig':'li';render();return}
 if(A==='closepost'){S.postOpen=null;render();return}
 if(A==='exception'){D.esc.unshift({id:'e'+(D.esc.length+1),d:'19 Aug',t:d.msg+', via exception',c:'Exception used',own:'nobody',fix:'Logged automatically',ex:1,es:'open'});
  logEv('Himanshu','Exception path used',d.msg);toast('Exception used, and an escalation entry was written for you.');render();return}
 /* work verbs */
 if(A==='wstart'){var w1=W(id);w1.ws='progress';logEv(pname(w1.own),'Work started',w1.t);render();toast(w1.t+' is now in progress.');return}
 if(A==='dosubmit'){var w2=W(id);w2.ws='submitted';w2.link=w2.link||'wk33_'+w2.id+'.file';bumpDl(w2,'s');
  logEv(pname(w2.own),'Output submitted',w2.t+' · '+w2.link);closeModal();render();
  toast('Submitted. '+(w2.dl||'No deliverable')+' submitted count went up by one. Now at the ship gate.');return}
 if(A==='wship'){var w3=W(id);w3.ws='ship';logEv(pname(S.role),'Ship gate signed',w3.t);render();toast('Ship gate signed. Now waiting on the craft gate.');return}
 if(A==='wcraft'){var w4=W(id);w4.ws='craft';logEv(pname(S.role),'Craft gate signed',w4.t);render();toast('Craft gate signed. Ready to send to the client.');return}
 if(A==='wexc'){var w4b=W(id);w4b.ws='craft';D.esc.unshift({id:'e'+(D.esc.length+1),d:'19 Aug',t:'Craft gate on '+w4b.t,c:'Exception used',own:'Shelly',fix:'Shelly holds the craft gate',ex:1,es:'open'});
  logEv('Himanshu','Craft gate signed by exception',w4b.t);render();toast('Signed by exception, and an escalation entry was written.');return}
 if(A==='wclient'){var w5=W(id);w5.ws='client';logEv(pname(S.role),'Sent to client',w5.t);render();toast('Sent to the client. It now shows on the client link.');return}
 if(A==='wapprove'){var w6=W(id);w6.ws='approved';bumpDl(w6,'a');logEv('Client','Approved',w6.t,'cl');render();
  toast('Client approved. '+(w6.dl||'No deliverable')+' approved count went up by one.');return}
 if(A==='wdone'){var w7=W(id);w7.ws='done';logEv(pname(S.role),'Completed',w7.t);render();toast(w7.t+' is done.');return}
 if(A==='hand'){var w8=W(id);var chain=['priyanka','shelly','hd','aashif','himanshu'];var to=w8.next,i=chain.indexOf(to);
  w8.own=to;w8.cx=w8.cx.split(' · ')[0]+' · handed to '+pname(to);w8.next=chain[(i+1)%chain.length];
  logEv(pname(S.role),'Handed over',w8.t+' to '+pname(to));render();toast(w8.t+' handed to '+pname(to)+'.');return}
 if(A==='doreassign'){var w9=W(id);var sel2=document.getElementById('reasel');var to2=sel2?sel2.value:'aashif';
  w9.own=to2;w9.cx=w9.cx.split(' · ')[0]+' · reassigned to '+pname(to2);
  logEv(pname(S.role),'Reassigned',w9.t+' to '+pname(to2));closeModal();render();toast('Reassigned to '+pname(to2)+'.');return}
 /* qc */
 if(A==='qcrow'){var q1=D.qc.filter(function(x){return x.id===id})[0];S.calTab=P(q1.p).c;go('calendar');toast('Opened the '+cName(P(q1.p).c)+' tracker at row '+q1.ref+'.');return}
 if(A==='qcwork'){var q2=D.qc.filter(function(x){return x.id===id})[0];go('project',q2.p);S.pTab='work';render();toast('Opened the work item on its project.');return}
 if(A==='qcfix'){var q3=D.qc.filter(function(x){return x.id===id})[0];q3.qs='cleared';
  var ck=D.cal[P(q3.p).c];if(ck)ck.rows.forEach(function(r){if(r.d===q3.ref)r.fixed=1});
  logEv(pname(S.role),'QC flag cleared after recheck',q3.t);render();
  toast('Row re-read. The gap is gone, so the flag cleared. If it were still there the flag would stay open.');return}
 if(A==='qcdismiss'){var q4=D.qc.filter(function(x){return x.id===id})[0];q4.qs='dismissed';
  logEv(pname(S.role),'QC flag dismissed as wrong',q4.t);render();toast('Dismissed. The rule is queued for review so it stops firing.');return}
 if(A==='recheck'){var rr=d.id.split(':');var row=D.cal[rr[0]].rows[+rr[1]];row.fixed=1;D.cal[rr[0]].read='just now';
  render();toast('Re-read that row only. The gap is cleared.');return}
 if(A==='recheckall'){D.cal[id].read='just now';render();toast('All rows re-read for '+cName(id)+'. Gaps that are still there stay open.');return}
 /* feedback */
 if(A==='fbrev'){var f1=D.fb.filter(function(x){return x.id===id})[0];f1.fs='revision';
  D.work.unshift({id:'w'+(D.work.length+1),p:f1.p,ty:'RV',t:'Revision: '+f1.item,cx:'From client feedback, round '+f1.round,own:f1.own,due:'22 Aug',next:'shelly',ws:'progress',dl:'',link:'',row:''});
  logEv(pname(S.role),'Revision created from feedback',f1.item+' · round '+f1.round+' of '+f1.inc);
  render();toast('Revision created and assigned to '+pname(f1.own)+'. Round '+f1.round+' of '+f1.inc+' used.');return}
 if(A==='fbdone'){var f2=D.fb.filter(function(x){return x.id===id})[0];f2.fs='reshared';
  logEv(pname(S.role),'Revision reshared with client',f2.item);render();toast('Reshared. It is back with the client and on their link.');return}
 if(A==='fbapproved'){var f3=D.fb.filter(function(x){return x.id===id})[0];f3.fs='approved';
  if(f3.w){var wf=W(f3.w);if(wf){wf.ws='approved';bumpDl(wf,'a')}}
  logEv('Client','Approved after revision',f3.item,'cl');render();toast('Client approved. The loop is closed and the deliverable count moved.');return}
 if(A==='fbresolve'){var f4=D.fb.filter(function(x){return x.id===id})[0];f4.fs='resolved';
  logEv(pname(S.role),'Feedback resolved, no production change',f4.item);render();toast('Resolved with no production change.');return}
 if(A==='fbscope'){var f5=D.fb.filter(function(x){return x.id===id})[0];f5.fs='scope';
  logEv(pname(S.role),'Feedback marked out of scope',f5.item);render();toast('Out of scope. It becomes a quote, not a task.');return}
 /* requests */
 if(A==='dotriage'){var r1=D.req.filter(function(x){return x.id===id})[0];r1.rs='triaged';
  logEv(pname(S.role),'Request triaged',r1.w);closeModal();render();toast('Triaged. Now it can be converted into work or quoted.');return}
 if(A==='doconvert'){var r2=D.req.filter(function(x){return x.id===id})[0];r2.rs='converted';
  D.work.unshift({id:'w'+(D.work.length+1),p:r2.p,ty:'RQ',t:r2.w,cx:'From request, '+r2.ty,own:r2.own.toLowerCase(),due:r2.ear,next:'shelly',ws:'briefed',dl:'',link:'',row:''});
  logEv(pname(S.role),'Request converted to work',r2.w);closeModal();render();toast('Work item created on '+P(r2.p).n+', due '+r2.ear+'.');return}
 if(A==='rdeliver'){var r3=D.req.filter(function(x){return x.id===id})[0];r3.rs='delivered';
  logEv(pname(S.role),'Request delivered',r3.w);render();toast('Marked delivered. Close it once the client confirms.');return}
 if(A==='rclose'){var r4=D.req.filter(function(x){return x.id===id})[0];r4.rs='closed';
  logEv(pname(S.role),'Request closed',r4.w);go('requests');toast('Closed. It stays in the log and the dispute pack.');return}
 /* escalations */
 if(A==='eschandle'){var e1=D.esc.filter(function(x){return x.id===id})[0];e1.es='handled';render();toast('Marked handled. It leaves the open list but stays in the record.');return}
 if(A==='doescconvert'){var e2=D.esc.filter(function(x){return x.id===id})[0];e2.es='converted';
  D.actions.unshift({t:e2.fix,own:'Himanshu',due:'30 Sep',from:e2.c+', from an escalation',st:'Open'});
  closeModal();render();toast('Action created with an owner and a date. That is the only thing that changes anything.');return}
 if(A==='esckeep'){var e3=D.esc.filter(function(x){return x.id===id})[0];e3.es='kept';render();toast('Kept. Genuinely yours, so it is not counted against the exit target.');return}
 /* onboarding */
 if(A==='onbdone'){var oa=id.split(':');var cc=C(oa[0]);cc.onb[+oa[1]]=1;
  if(+oa[1]===2)cc.brain='Written';
  render();toast('Step complete. '+onbDone(cc)+' of 9 done.');return}
 /* pipeline */
 if(A==='ppadvance'){var x1=D.pipe.filter(function(y){return y.id===id})[0];var i2=D.pipeStages.indexOf(x1.s);
  if(i2<4){x1.s=D.pipeStages[i2+1];x1.cold=0;render();toast('Moved to '+x1.s+'.')}else toast('Use mark won or mark lost from here.');return}
 if(A==='ppwon'){var x2=D.pipe.filter(function(y){return y.id===id})[0];x2.s='Won';x2.na='Complete onboarding';x2.w='Today';
  render();toast('Won. Client, project and the nine step onboarding have been created.');return}
 if(A==='pplost'){var x3=D.pipe.filter(function(y){return y.id===id})[0];x3.s='Lost';x3.na='Reason recorded';
  render();toast('Marked lost. The reason is kept so the pattern is visible later.');return}
 if(A==='doaddprospect'){D.pipe.unshift({id:'pp'+(D.pipe.length+1),n:'New prospect',m:'GCC',o:'Package A, foundation',v:'12,000',s:'Intro made',na:'First meeting',w:'26 Aug',cold:0,notes:'Added just now.'});
  closeModal();render();toast('Prospect added. Open it to move the stage or mark it won.');return}
 if(A==='ok'){toast(d.msg||'Done');return}
});
document.getElementById('scrim').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('sov').addEventListener('click',function(e){if(e.target===this)searchClose()});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeModal();searchClose()}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}
});
render();

</script>
